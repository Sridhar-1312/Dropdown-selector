<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown-Selector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hero">
        <div class="selector">
            <div id="select-feild">
                <p id="selectText">Select Social Media</p>
                <img src="images/arrow.png " id="arrowIcon" class="arrow">
            </div>
            <ul id="list" class="hide">
                <li class="options">
                    <img src="images/facebook.png" >
                    <p>FaceBook</p>
                </li>
                <li class="options">
                    <img src="images/instagram.png" >
                    <p>Instagram</p>
                </li>
                <li class="options">
                    <img src="images/pinterest.png" >
                    <p>Pinterest</p>
                </li>
                <li class="options">
                    <img src="images/twitter.png" >
                    <p>Twitter</p>
                </li>
                <li class="options">
                    <img src="images/whatsapp.png" >
                    <p>Whatsapp</p>
                </li>
                <li class="options" >
                    <img src="images/youtube.png" >
                    <p>YouTube</p>
                </li>
            </ul>
        </div>
        
    </div>


    <script src="script.js"></script>
</body>
</html>
